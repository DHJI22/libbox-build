name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег sing-box (например v1.12.0), смотри в Releases SagerNet/sing-box"
        required: true
        type: string
      ndk:
        description: "Версия NDK"
        required: true
        default: "28.0.12674087"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ inputs.ref }}
          path: sing-box
          fetch-depth: 0   # нужно, чтобы скрипт сборки прочитал тег версии

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ inputs.ndk }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ inputs.ndk }}" >> "$GITHUB_ENV"

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          make lib_install
          make lib_android

      - name: Show result
        run: ls -lh sing-box/libbox*.aar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ inputs.ref }}
          path: sing-box/libbox*.aar
          if-no-files-found: error
